[package]
name = "compat_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
once_cell = "1.21.4"
proc-macro2 = "1.0.106"
quote = "1.0.45"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["serde_derive"] }
syn = { version = "2.0.117", features = ["extra-traits", "full", "parsing"] }

[dev-dependencies]
serde_json = "1.0.149"
serde_with = "3.17.0"
