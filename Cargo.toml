[package]
name = "transmission-rpc"
version = "0.4.3"
authors = ["red <red.avtovo@gmail.com>"]
edition = "2021"
repository = "https://github.com/j0rsa/transmission-rpc"
license = "MIT"
readme = "README.md"
description = "Transmission JRPC client"
keywords = ["transmission", "torrent", "jrpc"]
categories = ["api-bindings"]
include = ["**/*.rs", "Cargo.toml"]

[features]
# Enables a thread-safe version of TransClient.
sync = []
# Enables Serialization and Deserialization of `TorrentGetField`s.
tor-get-serde = []

[dependencies]
compat_macros = { path = "compat_macros" }
reqwest = { version = "0.12.5", features = [
    "json",
    "rustls-tls",
], default-features = false }
serde = { version = "1.0.190", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1.17"
enum-iterator = "2.1.0"
chrono = {version = "0.4.31", features = ["serde"] }

log = "0.4.20"
bitflags = "2.10.0"
base64 = "0.22.1"
semver = "1.0.27"
convert_case = "0.11.0"
serde_with = { version = "3.17.0", features = ["macros"] }

[dev-dependencies]
env_logger = "0.11.3"
dotenvy = "0.15.7"
tokio = { version = "1.33.0", features = ["macros", "rt-multi-thread"] }
